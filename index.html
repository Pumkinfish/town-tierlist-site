<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Town Roblox - Weapon Tier List</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0c0d10;
      --panel: #131519;
      --panel-border: #232730;
      --card-bg: #17191e;
      --card-border: #242932;
      --card-hover: #3d4554;
      
      --text-main: #e8ecf2;
      --text-dim: #778190;
      --text-muted: #434a56;

      --tier-a: #992d2d;
      --tier-b: #b45f1b;
      --tier-c: #356e45;
      --tier-d: #2a5a78;
      --tier-f: #4a505a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text-main);
      font-family: "Rajdhani", sans-serif;
      padding: 32px 20px 60px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      max-width: 1080px;
      margin: 0 auto 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 3px;
    }

    .badge-sub {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 2px;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #fff;
      line-height: 1.1;
    }

    .segmented-control {
      display: inline-flex;
      background: #090a0d;
      border: 1px solid var(--panel-border);
      padding: 2px;
      border-radius: 2px;
    }

    .toggle-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      padding: 6px 18px;
      cursor: pointer;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      border-radius: 2px;
      transition: all 0.15s ease;
    }

    .toggle-btn.active {
      background: #1e222a;
      color: #fff;
      border-color: #323946;
    }

    .tier-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 1080px;
      margin: 0 auto;
    }

    .tier-row {
      display: flex;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      min-height: 98px;
    }

    .tier-label {
      width: 72px;
      min-width: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      user-select: none;
      border-right: 1px solid var(--panel-border);
    }

    .tier-A { background: var(--tier-a); }
    .tier-B { background: var(--tier-b); }
    .tier-C { background: var(--tier-c); }
    .tier-D { background: var(--tier-d); }
    .tier-F { background: var(--tier-f); }

    .tier-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px;
      align-items: center;
      flex-grow: 1;
      background: rgba(0, 0, 0, 0.2);
    }

    .empty-tier-text {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-left: 6px;
    }

    .card {
      width: 140px;
      height: 84px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px 8px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .card:hover {
      border-color: var(--card-hover);
      background: #1b1e25;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.6rem;
      color: var(--text-dim);
    }

    .card-img-wrap {
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img-wrap img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #1f232b;
      padding-top: 4px;
    }

    .card-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.5px;
    }

    .rank-pill {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-dim);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 8, 0.85);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .detail-card {
      width: 100%;
      max-width: 420px;
      background: #121418;
      border: 1px solid #2d333e;
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75);
    }

    .detail-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #16191f;
      border-bottom: 1px solid #222630;
    }

    .detail-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .detail-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .detail-tier-badge {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 2px;
      color: #fff;
    }

    .close-btn {
      cursor: pointer;
      color: var(--text-dim);
      font-family: "JetBrains Mono", monospace;
      font-size: 1.2rem;
      line-height: 1;
      background: transparent;
      border: none;
    }

    .close-btn:hover {
      color: #fff;
    }

    .detail-image {
      width: 100%;
      height: 140px;
      background: #090a0d;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      border-bottom: 1px solid #20242c;
    }

    .detail-image img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .detail-variant-title {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.72rem;
      color: var(--text-dim);
      background: #14171d;
      padding: 8px 16px;
      border-bottom: 1px solid #20242c;
      line-height: 1.4;
    }

    .stats-container {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
      background: #0f1115;
    }

    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-meta {
      display: flex;
      justify-content: space-between;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.68rem;
      color: var(--text-dim);
    }

    .stat-val-text {
      color: #fff;
      font-weight: 500;
    }

    .stat-bar-bg {
      width: 100%;
      height: 5px;
      background: #1b1e25;
      border: 1px solid #242932;
    }

    .stat-bar-fill {
      height: 100%;
      background: #64748b;
      transition: width 0.2s ease;
    }

    .total-score-card {
      margin: 0;
      background: #15181e;
      border-top: 1px solid #222630;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
    }

    .total-score-num {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .detail-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid #222630;
    }

    .nav-btn {
      background: #111317;
      border: none;
      color: #8b95a5;
      padding: 10px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .nav-btn:hover {
      background: #1a1e24;
      color: #fff;
    }

    .nav-btn:first-child {
      border-right: 1px solid #222630;
    }
  </style>
</head>
<body>

    <div>
      <div class="badge-sub">Town Roblox Armory Tier List</div>
      <h1>WEAPON TIERS</h1>
    </div>
    <div class="segmented-control">
      <button class="toggle-btn active" id="btn-stock" onclick="setViewMode(0)">Base</button>
      <button class="toggle-btn" id="btn-kitted" onclick="setViewMode(1)">Attachments</button>
    </div>
  </header>

  <div class="tier-container" id="tierContainer"></div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="detail-card" onclick="event.stopPropagation()">
      <div class="detail-header">
        <div class="detail-title-wrap">
          <span class="detail-title" id="detailTitle">P90</span>
          <span class="detail-tier-badge" id="detailTierBadge">C</span>
        </div>
        <button class="close-btn" onclick="closeModalDirect()">&times;</button>
      </div>
      <div class="detail-image">
        <img id="detailImg" src="" alt="Gun Preview">
      </div>
      <div class="detail-variant-title" id="detailVariantName">Stock Variant</div>
      <div class="stats-container" id="detailStats"></div>
      <div class="total-score-card">
        <span style="color: var(--text-dim);">Combat Rating</span>
        <span class="total-score-num" id="detailTotalScore">0 / 100</span>
      </div>
      <div class="detail-nav">
        <button class="nav-btn" onclick="cycleVariant(-1)">&larr;</button>
        <button class="nav-btn" onclick="cycleVariant(1)">&rarr;</button>
      </div>
    </div>
  </div>

              reloadSpeed: 7, ammoCount: 2, soundLevel: 3, runSpeed: 3, zombieTest: 5
            }
          },
          {

            img: "AR10Attached.png",
            stats: {
              damage: 14, fireRate: 10, recoilControl: 15, weight: 2, armorHandling: 7,
              reloadSpeed: 7, ammoCount: 2, soundLevel: 4, runSpeed: 2, zombieTest: 5
            }
          }
        ]

    function calcTotalScore(statsObj) {
      return Object.values(statsObj).reduce((sum, val) => sum + val, 0);
    }

    function getTier(score) {
      if (score >= 90) return 'A';
      if (score >= 70) return 'B';
      if (score >= 50) return 'C';
      if (score >= 25) return 'D';
      return 'F';
    }

    let activeViewMode = 0;
    let activeGunIndex = 0;
    let activeVariantIndex = 0;

    const tiers = ['A', 'B', 'C', 'D', 'F'];

    function setViewMode(mode) {
      activeViewMode = mode;
      document.getElementById('btn-stock').classList.toggle('active', mode === 0);
      document.getElementById('btn-kitted').classList.toggle('active', mode === 1);
      renderTierList();
    }

    function renderTierList() {
      const container = document.getElementById('tierContainer');
      container.innerHTML = '';

      const sortedTiers = { A: [], B: [], C: [], D: [], F: [] };

      weaponsData.forEach((gun, index) => {
        const variantIdx = Math.min(activeViewMode, gun.variants.length - 1);
        const variant = gun.variants[variantIdx];
        const score = calcTotalScore(variant.stats);
        const tier = getTier(score);

        sortedTiers[tier].push({
          gunIndex: index,
          variantIndex: variantIdx,
          name: gun.name,
          score: score,
          tier: tier,
          image: variant.img
        });
      });

      tiers.forEach(tierKey => {
        const row = document.createElement('div');
        row.className = 'tier-row';

        const label = document.createElement('div');
        label.className = `tier-label tier-${tierKey}`;
        label.innerText = tierKey;

        const cardsArea = document.createElement('div');
        cardsArea.className = 'tier-cards';

        sortedTiers[tierKey].sort((a, b) => b.score - a.score);

        if (sortedTiers[tierKey].length === 0) {
          const emptyNotice = document.createElement('span');
          emptyNotice.className = 'empty-tier-text';
          emptyNotice.innerText = 'EMPTY';
          cardsArea.appendChild(emptyNotice);
        } else {
          sortedTiers[tierKey].forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(item.gunIndex, item.variantIndex);

            card.innerHTML = `
              <div class="card-top">
                <span>${item.tier}</span>
                <span>${item.score}</span>
              </div>
              <div class="card-img-wrap">
                <img src="${item.image}" alt="${item.name}">
              </div>
              <div class="card-footer">
                <span class="card-title">${item.name}</span>
                <span class="rank-pill">${item.tier}</span>
              </div>
            `;
            cardsArea.appendChild(card);
          });
        }

        row.appendChild(label);
        row.appendChild(cardsArea);
        container.appendChild(row);
      });
    }

    function openModal(gunIdx, variantIdx = 0) {
      activeGunIndex = gunIdx;
      activeVariantIndex = variantIdx;
      updateModalContent();
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModalDirect() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function closeModal(e) {
      if (e.target.id === 'modalOverlay') {
        closeModalDirect();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModalDirect();
    });

    function cycleVariant(direction) {
      const gun = weaponsData[activeGunIndex];
      const totalVariants = gun.variants.length;
      activeVariantIndex = (activeVariantIndex + direction + totalVariants) % totalVariants;
      updateModalContent();
    }

    function updateModalContent() {
      const gun = weaponsData[activeGunIndex];
      const variant = gun.variants[activeVariantIndex];
      const score = calcTotalScore(variant.stats);
      const tier = getTier(score);

      document.getElementById('detailTitle').innerText = gun.name;
      
      const badge = document.getElementById('detailTierBadge');
      badge.innerText = tier;
      badge.className = `detail-tier-badge tier-${tier}`;

      document.getElementById('detailImg').src = variant.img;
      document.getElementById('detailVariantName').innerText = variant.name;
      document.getElementById('detailTotalScore').innerText = `${score} / 100`;

      const statsContainer = document.getElementById('detailStats');
      statsContainer.innerHTML = '';

      statConfig.forEach(cfg => {
        const val = variant.stats[cfg.key] ?? 0;
        const pct = Math.min(100, Math.round((val / cfg.max) * 100));

        const row = document.createElement('div');
        row.className = 'stat-row';
        row.innerHTML = `
          <div class="stat-meta">
            <span>${cfg.label}</span>
            <span class="stat-val-text">${val} / ${cfg.max}</span>
          </div>
          <div class="stat-bar-bg">
            <div class="stat-bar-fill" style="width: ${pct}%;"></div>
          </div>
        `;
        statsContainer.appendChild(row);
      });
    }

    renderTierList();
  </script>
</body>
</html>
