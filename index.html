<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Town Roblox - Weapon Tier List</title>

  <style>
    :root {
      --dark: #202022;
      --accent: #1c1c1f;
      --text: #c5c5c5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--accent);
    }

    .title-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sub-title {
      font-size: 13px;
      color: var(--text);
      opacity: 0.8;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .toggle-btn {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: var(--dark);
      border-color: var(--text);
    }

    .tier-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tier-row {
      display: flex;
      background: var(--accent);
      border-radius: 8px;
      min-height: 100px;
      overflow: hidden;
    }

    .tier-label {
      width: 80px;
      min-width: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      background: var(--accent);
      border-right: 1px solid var(--dark);
    }

    .tier-items {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
      align-items: center;
      flex-grow: 1;
      background: var(--dark);
    }

    .empty-text {
      font-size: 13px;
      color: var(--text);
      opacity: 0.5;
      padding-left: 8px;
    }

    .card {
      width: 130px;
      height: 90px;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px 8px;
    }

    .card:hover {
      border-color: var(--text);
    }

    .card img {
      width: 100%;
      height: 52px;
      object-fit: contain;
    }

    .card-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text);
    }

    .card-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 85px;
      font-weight: 600;
    }

    .card-tier {
      font-size: 11px;
      opacity: 0.8;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(28, 28, 31, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-window {
      width: 100%;
      max-width: 400px;
      background: var(--accent);
      border-radius: 8px;
      border: 1px solid var(--accent);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--dark);
    }

    .modal-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .modal-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 6px;
      background: var(--dark);
      border-radius: 4px;
      color: var(--text);
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-image {
      width: 100%;
      height: 140px;
      background: var(--dark);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-image img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .modal-variant {
      padding: 10px 16px;
      font-size: 13px;
      color: var(--text);
      border-bottom: 1px solid var(--dark);
    }

    .modal-stats {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      background: var(--dark);
    }

    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .stat-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text);
    }

    .stat-bar {
      width: 100%;
      height: 6px;
      background: var(--accent);
      border-radius: 3px;
      overflow: hidden;
    }

    .stat-fill {
      height: 100%;
      background: var(--text);
    }

    .modal-score {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      border-top: 1px solid var(--dark);
    }

    .modal-nav {
      display: flex;
      border-top: 1px solid var(--dark);
    }

    .nav-btn {
      flex: 1;
      background: var(--accent);
      border: none;
      color: var(--text);
      padding: 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .nav-btn:hover {
      background: var(--dark);
    }

    .nav-btn:first-child {
      border-right: 1px solid var(--dark);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-group">
        <span class="sub-title">Town Roblox Armory Tier List</span>
        <h1>WEAPON TIERS</h1>
      </div>
      <div class="controls">
        <button class="toggle-btn active" id="btn-stock" onclick="setViewMode(0)">Base</button>
        <button class="toggle-btn" id="btn-kitted" onclick="setViewMode(1)">Attachments</button>
      </div>
    </header>

    <main class="tier-list" id="tierContainer"></main>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-window" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title-group">
          <span class="modal-title" id="detailTitle">P90</span>
          <span class="modal-badge" id="detailTierBadge">C</span>
        </div>
        <button class="modal-close" onclick="closeModalDirect()">&times;</button>
      </div>

      <div class="modal-image">
        <img id="detailImg" src="" alt="Weapon">
      </div>

      <div class="modal-variant" id="detailVariantName">P90 (No Attachments)</div>

      <div class="modal-stats" id="detailStats"></div>

      <div class="modal-score">
        <span>Combat Rating</span>
        <span id="detailTotalScore">0 / 100</span>
      </div>

      <div class="modal-nav">
        <button class="nav-btn" onclick="cycleVariant(-1)">&larr;</button>
        <button class="nav-btn" onclick="cycleVariant(1)">&rarr;</button>
      </div>
    </div>
  </div>

  <script>
    const statConfig = [
      { key: "damage", label: "Damage", max: 20 },
      { key: "fireRate", label: "Fire Rate", max: 15 },
      { key: "recoilControl", label: "Recoil Control", max: 15 },
      { key: "weight", label: "Weight", max: 10 },
      { key: "armorHandling", label: "Armor Handling", max: 10 },
      { key: "reloadSpeed", label: "Reload Speed", max: 10 },
      { key: "ammoCount", label: "Ammo Count", max: 5 },
      { key: "soundLevel", label: "Sound Level", max: 5 },
      { key: "runSpeed", label: "Run Speed", max: 5 },
      { key: "zombieTest", label: "Zombie Test", max: 5 }
    ];

    const weaponsData = [
      {
        id: "p90",
        name: "P90",
        variants: [
          {
            name: "P90 (No Attachments)",
            img: "P90Base.png",

              reloadSpeed: 5, ammoCount: 3, soundLevel: 2, runSpeed: 4, zombieTest: 4
            }
          },
          {

            img: "P90Attached.png",
            stats: {

              reloadSpeed: 5, ammoCount: 4, soundLevel: 3, runSpeed: 3, zombieTest: 4
            }
          }
        ]
      },
      {
        id: "ag18c",
        name: "AG-18c",
        variants: [
          {
            name: "AG-18c (No Attachments)",
            img: "AG18c.png",
            stats: {
              damage: 10, fireRate: 14, recoilControl: 7, weight: 15, armorHandling: 6,
              reloadSpeed: 6, ammoCount: 2, soundLevel: 2, runSpeed: 5, zombieTest: 3
            }
          },
          {
            name: "AG-18c (Oil Filter, Combo Laser, Romeo Sight, Extend Stock)",
            img: "AG18cAttached.png",
            stats: {
              damage: 10, fireRate: 14, recoilControl: 13, weight: 15, armorHandling: 6,
              reloadSpeed: 6, ammoCount: 2, soundLevel: 3, runSpeed: 3, zombieTest: 3
            }
          }
        ]
      },
      {
        id: "ag19",
        name: "AG-19",
        variants: [
          {
            name: "AG-19 (No Attachments)",
            img: "AG19.png",
            stats: {
              damage: 10, fireRate: 14, recoilControl: 7, weight: 15, armorHandling: 5,
              reloadSpeed: 6, ammoCount: 2, soundLevel: 2, runSpeed: 5, zombieTest: 3
            }
          },
          {
            name: "AG-19 (Heavy Suppresor, Combo Laser, Romeo Sight)",
            img: "AG19Attached.png",
            stats: {
              damage: 10, fireRate: 14, recoilControl: 13, weight: 15, armorHandling: 5,
              reloadSpeed: 6, ammoCount: 2, soundLevel: 3, runSpeed: 3, zombieTest: 3
            }
          }
        ]
      },
      {
        id: "mac10",
        name: "Mac-10",
        variants: [
          {
            name: "Mac-10 (No Attachments)",
            img: "Mac10.png",
            stats: {
              damage: 10, fireRate: 15, recoilControl: 5, weight: 8, armorHandling: 6,
              reloadSpeed: 8, ammoCount: 2, soundLevel: 3, runSpeed: 5, zombieTest: 2
            }
          },
          {
            name: "Mac-10 (Heavy Suppressor, Combo Laser, Romeo Sight, Hera QCR Front Grip, Extended Stock)",
            img: "Mac10Attached.png",
            stats: {
              damage: 8, fireRate: 15, recoilControl: 8, weight: 6, armorHandling: 6,
              reloadSpeed: 8, ammoCount: 3, soundLevel: 4, runSpeed: 3, zombieTest: 3
            }
          }
        ]
      },
      {
        id: "maxim9",
        name: "Maxim 9",
        variants: [
          {
            name: "Maxim 9",
            img: "Maxim9.png",
            stats: {
              damage: 11, fireRate: 12, recoilControl: 13, weight: 10, armorHandling: 6,
              reloadSpeed: 8, ammoCount: 2, soundLevel: 3, runSpeed: 5, zombieTest: 5
            }
          },
          {
            name: "Maxim 9 (N/A)",
            img: "Maxim9.png",
            stats: {
              damage: 11, fireRate: 12, recoilControl: 13, weight: 10, armorHandling: 6,
              reloadSpeed: 8, ammoCount: 2, soundLevel: 4, runSpeed: 5, zombieTest: 5
            }
          }
        ]
      },
      {
        id: "mp5",
        name: "MP5K",
        variants: [
          {
            name: "MP5",
            img: "MP5.png",
            stats: {
              damage: 9, fireRate: 12, recoilControl: 13, weight: 8, armorHandling: 7,
              reloadSpeed: 8, ammoCount: 3, soundLevel: 3, runSpeed: 4, zombieTest: 3
            }
          },
          {
            name: "MP5 (Extended Stock, Hera QCR Front Grip, Heavy Suppressor, Combo Laser, Romeo Sight)",
            img: "MP5Attached.png",
            stats: {
              damage: 9, fireRate: 12, recoilControl: 15, weight: 7, armorHandling: 7,
              reloadSpeed: 8, ammoCount: 3, soundLevel: 4, runSpeed: 2, zombieTest: 3
            }
          }
        ]
      },
      {
        id: "tmp",
        name: "TMP",
        variants: [
          {
            name: "TMP",

              damage: 9, fireRate: 12, recoilControl: 13, weight: 8, armorHandling: 5,
              reloadSpeed: 9, ammoCount: 2, soundLevel: 3, runSpeed: 5, zombieTest: 4
            }
          },
          {
            name: "TMP (Extended Stock, Hera QCR Front Grip, Heavy Suppressor, Combo Laser, Romeo Sight)",
            img: "TMPAttached.png",
            stats: {
              damage: 9, fireRate: 12, recoilControl: 15, weight: 8, armorHandling: 5,
              reloadSpeed: 9, ammoCount: 3, soundLevel: 4, runSpeed: 3, zombieTest: 4
            }
          }
        ]
      },
      {
        id: "barret",
        name: "Barret M82A3",
        variants: [
          {
            name: "Barret M82A3",
            img: "Bar.png",
            stats: {
              damage: 20, fireRate: 6, recoilControl: 2, weight: 2, armorHandling: 10,
              reloadSpeed: 1, ammoCount: 2, soundLevel: 3, runSpeed: 5, zombieTest: 4
            }
          },
          {
            name: "Barret M82A3 (Professional Scope, Bipod, Range Finder)",
            img: "BarAttached.png",
            stats: {
              damage: 20, fireRate: 6, recoilControl: 2, weight: 1, armorHandling: 10,
              reloadSpeed: 1, ammoCount: 2, soundLevel: 4, runSpeed: 3, zombieTest: 2
            }
          }
        ]
      },
      {
        id: "gm6",
        name: "GM6 Lynx",
        variants: [
          {
            name: "GM6 Lynx",
            img: "GM6.png",
            stats: {
              damage: 20, fireRate: 8, recoilControl: 1, weight: 2, armorHandling: 9,
              reloadSpeed: 1, ammoCount: 1, soundLevel: 3, runSpeed: 5, zombieTest: 2
            }
          },
          {
            name: "GM6 Lynx (Professional Scope, Bipod, Range Finder)",
            img: "GM6Lynx.png",
            stats: {
              damage: 20, fireRate: 8, recoilControl: 1, weight: 1, armorHandling: 9,
              reloadSpeed: 1, ammoCount: 1, soundLevel: 4, runSpeed: 3, zombieTest: 2
            }
          }
        ]
      },
      {
        id: "ar10",
        name: "AR 10",
        variants: [
          {
            name: "AR 10",
            img: "AR10.png",
            stats: {
              damage: 14, fireRate: 10, recoilControl: 10, weight: 3, armorHandling: 8,
              reloadSpeed: 7, ammoCount: 2, soundLevel: 3, runSpeed: 3, zombieTest: 5
            }
          },
          {
            name: "AR 10 (Romeo Sight, Combo Laser, Hera, Heavy)",
            img: "AR10Attached.png",
            stats: {
              damage: 14, fireRate: 10, recoilControl: 15, weight: 2, armorHandling: 8,
              reloadSpeed: 7, ammoCount: 2, soundLevel: 4, runSpeed: 2, zombieTest: 5
            }
          }
        ]
      }
    ];

    function calcTotalScore(statsObj) {
      return Object.values(statsObj).reduce((sum, val) => sum + val, 0);
    }

    function getTier(score) {
      if (score >= 90) return 'A';
      if (score >= 70) return 'B';
      if (score >= 50) return 'C';
      if (score >= 25) return 'D';
      return 'F';
    }

    let activeViewMode = 0;
    let activeGunIndex = 0;
    let activeVariantIndex = 0;

    const tiers = ['A', 'B', 'C', 'D', 'F'];

    function setViewMode(mode) {
      activeViewMode = mode;
      document.getElementById('btn-stock').classList.toggle('active', mode === 0);
      document.getElementById('btn-kitted').classList.toggle('active', mode === 1);
      renderTierList();
    }

    function renderTierList() {
      const container = document.getElementById('tierContainer');
      container.innerHTML = '';

      const sortedTiers = { A: [], B: [], C: [], D: [], F: [] };

      weaponsData.forEach((gun, index) => {
        const variantIdx = Math.min(activeViewMode, gun.variants.length - 1);
        const variant = gun.variants[variantIdx];
        const score = calcTotalScore(variant.stats);
        const tier = getTier(score);

        sortedTiers[tier].push({
          gunIndex: index,
          variantIndex: variantIdx,
          name: gun.name,
          score: score,
          tier: tier,
          image: variant.img
        });
      });

      tiers.forEach(tierKey => {
        const row = document.createElement('div');
        row.className = 'tier-row';

        const label = document.createElement('div');
        label.className = 'tier-label';
        label.innerText = tierKey;

        const itemsArea = document.createElement('div');
        itemsArea.className = 'tier-items';

        sortedTiers[tierKey].sort((a, b) => b.score - a.score);

        if (sortedTiers[tierKey].length === 0) {
          const emptyNotice = document.createElement('span');
          emptyNotice.className = 'empty-text';
          emptyNotice.innerText = 'EMPTY';
          itemsArea.appendChild(emptyNotice);
        } else {
          sortedTiers[tierKey].forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(item.gunIndex, item.variantIndex);

            card.innerHTML = `
              <img src="${item.image}" alt="${item.name}">
              <div class="card-info">
                <span class="card-name">${item.name}</span>
                <span class="card-tier">${item.tier}</span>
              </div>
            `;
            itemsArea.appendChild(card);
          });
        }

        row.appendChild(label);
        row.appendChild(itemsArea);
        container.appendChild(row);
      });
    }

    function openModal(gunIdx, variantIdx = 0) {
      activeGunIndex = gunIdx;
      activeVariantIndex = variantIdx;
      updateModalContent();
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModalDirect() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function closeModal(e) {
      if (e.target.id === 'modalOverlay') {
        closeModalDirect();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModalDirect();
    });

    function cycleVariant(direction) {
      const gun = weaponsData[activeGunIndex];
      const totalVariants = gun.variants.length;
      activeVariantIndex = (activeVariantIndex + direction + totalVariants) % totalVariants;
      updateModalContent();
    }

    function updateModalContent() {
      const gun = weaponsData[activeGunIndex];
      const variant = gun.variants[activeVariantIndex];
      const score = calcTotalScore(variant.stats);
      const tier = getTier(score);

      document.getElementById('detailTitle').innerText = gun.name;
      document.getElementById('detailTierBadge').innerText = tier;
      document.getElementById('detailImg').src = variant.img;
      document.getElementById('detailVariantName').innerText = variant.name;
      document.getElementById('detailTotalScore').innerText = `${score} / 100`;

      const statsContainer = document.getElementById('detailStats');
      statsContainer.innerHTML = '';

      statConfig.forEach(cfg => {
        const val = variant.stats[cfg.key] ?? 0;
        const pct = Math.min(100, Math.round((val / cfg.max) * 100));

        const row = document.createElement('div');
        row.className = 'stat-row';
        row.innerHTML = `
          <div class="stat-meta">
            <span>${cfg.label}</span>
            <span>${val} / ${cfg.max}</span>
          </div>
          <div class="stat-bar">
            <div class="stat-fill" style="width: ${pct}%;"></div>
          </div>
        `;
        statsContainer.appendChild(row);
      });
    }

    renderTierList();
  </script>
</body>
</html>
