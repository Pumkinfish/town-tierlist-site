<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Town Roblox - Weapon Tier List</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #121214;
      --card-bg: #1c1c20;
      --card-header: #26262c;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --border-color: #333338;
      --accent-gray: #e4e4e7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }

    .toggle-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 400;
      transition: all 0.2s ease;
    }

    .toggle-btn.active {
      background-color: var(--accent-gray);
      color: var(--bg-dark);
      border-color: var(--accent-gray);
      font-weight: 500;
    }

    .tier-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .tier-row {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      min-height: 110px;
      overflow: hidden;
    }

    .tier-label {
      width: 70px;
      min-width: 70px;
      background: var(--card-header);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 500;
      color: var(--accent-gray);
      border-right: 1px solid var(--border-color);
    }

    .tier-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px;
      align-items: center;
      flex-grow: 1;
    }

    .card {
      width: 135px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-gray);
    }

    .card-title {
      background: var(--card-header);
      padding: 7px 6px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.2px;
    }

    .card-image {
      width: 100%;
      height: 75px;
      background: #0d0d0f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .detail-card {
      width: 100%;
      max-width: 340px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
    }

    .detail-header {
      background: var(--card-header);
      padding: 12px 16px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }

    .close-btn {
      position: absolute;
      right: 14px;
      top: 10px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.2rem;
      font-weight: 300;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    .detail-image {
      width: 100%;
      height: 160px;
      background: #0d0d0f;
      border-bottom: 1px solid var(--border-color);
    }

    .detail-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .detail-variant-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      padding: 10px 14px 0 14px;
      font-weight: 400;
    }

    .stats-container {
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 250px;
      overflow-y: auto;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      border-bottom: 1px solid #27272c;
      padding-bottom: 3px;
    }

    .stat-name {
      color: var(--text-muted);
      font-weight: 400;
    }

    .stat-value {
      font-weight: 500;
      color: var(--text-main);
    }

    .total-score-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      padding-top: 8px;
      font-weight: 500;
      font-size: 0.95rem;
      border-top: 1px dashed var(--border-color);
    }

    .detail-nav {
      display: flex;
      border-top: 1px solid var(--border-color);
      background: var(--card-header);
    }

    .nav-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px;
      font-size: 1.1rem;
      font-weight: 300;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .nav-btn:hover {
      background: #2f2f36;
      color: var(--text-main);
    }

    .nav-btn:first-child {
      border-right: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>TOWN ROBLOX WEAPON TIERS</h1>
    <div class="controls">
      <button class="toggle-btn active" id="btn-stock" onclick="setViewMode(0)">Base</button>
      <button class="toggle-btn" id="btn-kitted" onclick="setViewMode(1)">Attachments</button>
    </div>
  </header>

  <div class="tier-container" id="tierContainer"></div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="detail-card" onclick="event.stopPropagation()">
      <div class="detail-header">
        <span id="detailTitle">P90 (C)</span>
        <span class="close-btn" onclick="closeModalDirect()">&times;</span>
      </div>
      <div class="detail-image">
        <img id="detailImg" src="" alt="Gun Preview">
      </div>
      <div class="detail-variant-title" id="detailVariantName">Stock Variant</div>
      <div class="stats-container" id="detailStats"></div>
      <div class="detail-nav">
        <button class="nav-btn" onclick="cycleVariant(-1)">&lt;</button>
        <button class="nav-btn" onclick="cycleVariant(1)">&gt;</button>
      </div>
    </div>
  </div>

  <script>
    const statConfig = [
      { key: "damage", label: "Damage (/20)" },
      { key: "fireRate", label: "Fire Rate (/15)" },
      { key: "recoilControl", label: "Recoil Control (/15)" },
      { key: "weight", label: "Weight (/10)" },
      { key: "armorHandling", label: "Armor Handling (/10)" },
      { key: "reloadSpeed", label: "Reload Speed (/10)" },
      { key: "ammoCount", label: "Ammo Count (/5)" },
      { key: "soundLevel", label: "Sound Level (/5)" },
      { key: "runSpeed", label: "Run Speed (/5)" },
      { key: "zombieTest", label: "Zombie Test (/5)" }
    ];

    const weaponsData = [
      {
        id: "p90",
        name: "P90",
        variants: [
          {
            name: "P90 (No Attachments)",
            img: "P90Base.png",
            stats: {
              damage: 11, fireRate: 14, recoilControl: 11, weight: 7, armorHandling: 5,
              reloadSpeed: 5, ammoCount: 3, soundLevel: 2, runSpeed: 4, zombieTest: 4
            }
          },
          {
            name: "P90 (Heavy Suppressor, Combo Laser, Romeo Sight)",
            img: "P90Attached.png",
            stats: {
              damage: 11, fireRate: 14, recoilControl: 13, weight: 5, armorHandling: 5,
              reloadSpeed: 5, ammoCount: 3, soundLevel: 3, runSpeed: 3, zombieTest: 4
            }
          }
        ]
      },
      {
        id: "ag18c",
        name: "AG-18c",
        variants: [
          {
            name: "AG-18c (No Attachments)",
            img: "AG18c.png",
            stats: {
              damage: 8, fireRate: 14, recoilControl: 7, weight: 15, armorHandling: 5,
              reloadSpeed: 6, ammoCount: 2, soundLevel: 2, runSpeed: 5, zombieTest: 3
            }
          },
          {
            name: "AG-18c (Oil Filter, Combo Laser, Romeo Sight, Extend Stock)",
            img: "AG18cAttached.png",
            stats: {
              damage: 10, fireRate: 14, recoilControl: 13, weight: 15, armorHandling: 5,
              reloadSpeed: 6, ammoCount: 2, soundLevel: 3, runSpeed: 3, zombieTest: 3
            }
          }
        ]
      },
      {
        id: "ag19",
        name: "AG-19",
        variants: [
          {
            name: "AG-19 (No Attachments)",
            img: "AG19.png",
            stats: {
              damage: 10, fireRate: 14, recoilControl: 7, weight: 15, armorHandling: 5,
              reloadSpeed: 6, ammoCount: 2, soundLevel: 2, runSpeed: 5, zombieTest: 3
            }
          },
          {
            name: "AG-19 (Heavy Suppresor, Combo Laser, Romeo Sight)",
            img: "AG19Attached.png",
            stats: {
              damage: 10, fireRate: 14, recoilControl: 13, weight: 15, armorHandling: 5,
              reloadSpeed: 6, ammoCount: 2, soundLevel: 3, runSpeed: 3, zombieTest: 3
            }
          }
        ]
      },
      {
        id: "mac10",
        name: "Mac-10",
        variants: [
          {
            name: "Mac-10 (No Attachments)",
            img: "Mac10.png",
            stats: {
              damage: 10, fireRate: 15, recoilControl: 5, weight: 8, armorHandling: 5,
              reloadSpeed: 8, ammoCount: 2, soundLevel: 3, runSpeed: 5, zombieTest: 2
            }
          },
          {
            name: "Mac-10 (Heavy Suppressor, Combo Laser, Romeo Sight, Hera QCR Front Grip, Extended Stock)",
            img: "Mac10Attached.png",
            stats: {
              damage: 8, fireRate: 15, recoilControl: 8, weight: 6, armorHandling: 5,
              reloadSpeed: 8, ammoCount: 2, soundLevel: 4, runSpeed: 3, zombieTest: 3
            }
          }
        ]
      },
      {
        id: "maxim9",
        name: "Maxim 9",
        variants: [
          {
            name: "Maxim 9",
            img: "Maxim9.png",
            stats: {
              damage: 11, fireRate: 12, recoilControl: 13, weight: 10, armorHandling: 5,
              reloadSpeed: 8, ammoCount: 2, soundLevel: 3, runSpeed: 5, zombieTest: 5
            }
          },
          {
            name: "Maxim 9 (N/A)",
            img: "Maxim9.png",
            stats: {
              damage: 11, fireRate: 12, recoilControl: 13, weight: 10, armorHandling: 5,
              reloadSpeed: 8, ammoCount: 2, soundLevel: 4, runSpeed: 5, zombieTest: 5
            }
          }
        ]
      },
      {
        id: "mp5",
        name: "MP5K",
        variants: [
          {
            name: "MP5",
            img: "MP5.png",
            stats: {
              damage: 9, fireRate: 12, recoilControl: 13, weight: 8, armorHandling: 5,
              reloadSpeed: 8, ammoCount: 2, soundLevel: 3, runSpeed: 4, zombieTest: 3
            }
          },
          {
            name: "MP5 (Extended Stock, Hera QCR Front Grip, Heavy Suppressor, Combo Laser, Romeo Sight)",
            img: "MP5Attached.png",
            stats: {
              damage: 9, fireRate: 12, recoilControl: 15, weight: 5, armorHandling: 5,
              reloadSpeed: 8, ammoCount: 2, soundLevel: 4, runSpeed: 2, zombieTest: 3
            }
          }
        ]
      },
      {
        id: "tmp",
        name: "TMP",
        variants: [
          {
            name: "TMP",
            img: "TMp.png",
            stats: {
              damage: 9, fireRate: 12, recoilControl: 13, weight: 8, armorHandling: 5,
              reloadSpeed: 9, ammoCount: 2, soundLevel: 3, runSpeed: 5, zombieTest: 4
            }
          },
          {
            name: "TMP (Extended Stock, Hera QCR Front Grip, Heavy Suppressor, Combo Laser, Romeo Sight)",
            img: "TMPAttached.png",
            stats: {
              damage: 9, fireRate: 12, recoilControl: 15, weight: 8, armorHandling: 5,
              reloadSpeed: 9, ammoCount: 2, soundLevel: 4, runSpeed: 3, zombieTest: 4
            }
          }
        ]
      },
      {
        id: "barret",
        name: "Barret M82A3",
        variants: [
          {
            name: "Barret M82A3",
            img: "Bar.png",
            stats: {
              damage: 20, fireRate: 6, recoilControl: 2, weight: 2, armorHandling: 10,
              reloadSpeed: 9, ammoCount: 2, soundLevel: 3, runSpeed: 5, zombieTest: 4
            }
          },
          {
            name: "Barret M82A3 (Professional Scope, Bipod, Range Finder)",
            img: "BarAttached.png",
            stats: {
              damage: 20, fireRate: 6, recoilControl: 2, weight: 1, armorHandling: 10,
              reloadSpeed: 1, ammoCount: 2, soundLevel: 4, runSpeed: 3, zombieTest: 2
            }
          }
        ]
      },
      {
        id: "gm6",
        name: "GM6 Lynx",
        variants: [
          {
            name: "GM6 Lynx",
            img: "GM6.png",
            stats: {
              damage: 20, fireRate: 8, recoilControl: 1, weight: 2, armorHandling: 8,
              reloadSpeed: 9, ammoCount: 1, soundLevel: 3, runSpeed: 5, zombieTest: 2
            }
          },
          {
            name: "GM6 Lynx (Professional Scope, Bipod, Range Finder)",
            img: "GM6Lynx.png",
            stats: {
              damage: 20, fireRate: 8, recoilControl: 1, weight: 1, armorHandling: 8,
              reloadSpeed: 1, ammoCount: 1, soundLevel: 4, runSpeed: 3, zombieTest: 2
            }
          }
        ]
      },
    ];

    function calcTotalScore(statsObj) {
      return Object.values(statsObj).reduce((sum, val) => sum + val, 0);
    }

    function getTier(score) {
      if (score >= 90) return 'A';
      if (score >= 75) return 'B';
      if (score >= 55) return 'C';
      if (score >= 25) return 'D';
      return 'F';
    }

    let activeViewMode = 0;
    let activeGunIndex = 0;
    let activeVariantIndex = 0;

    const tiers = ['A', 'B', 'C', 'D', 'F'];

    function setViewMode(mode) {
      activeViewMode = mode;
      document.getElementById('btn-stock').classList.toggle('active', mode === 0);
      document.getElementById('btn-kitted').classList.toggle('active', mode === 1);
      renderTierList();
    }

    function renderTierList() {
      const container = document.getElementById('tierContainer');
      container.innerHTML = '';

      const sortedTiers = { A: [], B: [], C: [], D: [], F: [] };

      weaponsData.forEach((gun, index) => {
        const variantIdx = Math.min(activeViewMode, gun.variants.length - 1);
        const variant = gun.variants[variantIdx];
        const score = calcTotalScore(variant.stats);
        const tier = getTier(score);

        sortedTiers[tier].push({
          gunIndex: index,
          variantIndex: variantIdx,
          name: gun.name,
          score: score,
          tier: tier,
          image: variant.img
        });
      });

      tiers.forEach(tierKey => {
        const row = document.createElement('div');
        row.className = 'tier-row';

        const label = document.createElement('div');
        label.className = 'tier-label';
        label.innerText = tierKey;

        const cardsArea = document.createElement('div');
        cardsArea.className = 'tier-cards';

        sortedTiers[tierKey].sort((a, b) => b.score - a.score);

        sortedTiers[tierKey].forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => openModal(item.gunIndex, item.variantIndex);

          card.innerHTML = `
            <div class="card-title">${item.name} (${item.tier})</div>
            <div class="card-image">
              <img src="${item.image}" alt="${item.name}">
            </div>
          `;
          cardsArea.appendChild(card);
        });

        row.appendChild(label);
        row.appendChild(cardsArea);
        container.appendChild(row);
      });
    }

    function openModal(gunIdx, variantIdx = 0) {
      activeGunIndex = gunIdx;
      activeVariantIndex = variantIdx;
      updateModalContent();
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModalDirect() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function closeModal(e) {
      if (e.target.id === 'modalOverlay') {
        closeModalDirect();
      }
    }

    function cycleVariant(direction) {
      const gun = weaponsData[activeGunIndex];
      const totalVariants = gun.variants.length;
      activeVariantIndex = (activeVariantIndex + direction + totalVariants) % totalVariants;
      updateModalContent();
    }

    function updateModalContent() {
      const gun = weaponsData[activeGunIndex];
      const variant = gun.variants[activeVariantIndex];
      const score = calcTotalScore(variant.stats);
      const tier = getTier(score);

      document.getElementById('detailTitle').innerText = `${gun.name} (${tier})`;
      document.getElementById('detailImg').src = variant.img;
      document.getElementById('detailVariantName').innerText = variant.name;

      const statsContainer = document.getElementById('detailStats');
      statsContainer.innerHTML = '';

      statConfig.forEach(item => {
        const row = document.createElement('div');
        row.className = 'stat-row';
        row.innerHTML = `
          <span class="stat-name">${item.label}</span>
          <span class="stat-value">${variant.stats[item.key] ?? 0}</span>
        `;
        statsContainer.appendChild(row);
      });

      const totalRow = document.createElement('div');
      totalRow.className = 'total-score-row';
      totalRow.innerHTML = `
        <span>Total Score:</span>
        <span>${score} / 100</span>
      `;
      statsContainer.appendChild(totalRow);
    }

    renderTierList();
  </script>
</body>
</html>
