name: Unstick Pages
on: workflow_dispatch

jobs:
  clear-deployments:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Clear Stuck Deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh api repos/${{ github.repository }}/deployments --jq '.[].id'); do
            echo "Deactivating deployment $id"
            gh api --method POST repos/${{ github.repository }}/deployments/$id/statuses -f state=inactive || true
            echo "Deleting deployment $id"
            gh api --method DELETE repos/${{ github.repository }}/deployments/$id || true
          done
